<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Usuários | HelpDesk</title>
</head>

<body>
    <h1>Usuários cadastrados</h1>
    <p th:if="${mensagem}" th:text="${mensagem}" role="status"></p>
    <p><a th:href="@{/usuarios/novo}">Novo usuário</a></p>

    <p th:if="${#lists.isEmpty(usuarios)}">Nenhum usuário cadastrado.</p>

    <table th:unless="${#lists.isEmpty(usuarios)}">
        <thead>
            <tr>
                <th scope="col">ID</th>
                <th scope="col">Nome</th>
                <th scope="col">E-mail</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.id}"></td>
                <td th:text="${usuario.nome}"></td>
                <td th:text="${usuario.email}"></td>
                <td>
                    <a th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>

                    <form method="post" th:action="@{/usuarios/{id}/excluir(id=${usuario.id})}"
                        onsubmit="return confirm('Excluir este usuário?');">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>

</html>
