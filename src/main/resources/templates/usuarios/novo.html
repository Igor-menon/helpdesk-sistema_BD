<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuário | HelpDesk</title>
</head>
<body>
    <h1 th:text="${usuarioId != null ? 'Editar usuário' : 'Cadastro de usuário'}">
        Cadastro de usuário
    </h1>

    <p th:if="${mensagem}" th:text="${mensagem}" role="status"></p>

    <form method="post"
          th:action="${usuarioId != null} ? @{/usuarios/{id}/editar(id=${usuarioId})} : @{/usuarios/novo}"
          th:object="${cadastro}">
        <p>
            <label for="nome">Nome</label>
            <input type="text" th:field="*{nome}" maxlength="120" required>
            <span th:errors="*{nome}"></span>
        </p>
        <p>
            <label for="email">E-mail</label>
            <input type="email" th:field="*{email}" maxlength="254" required>
            <span th:errors="*{email}"></span>
        </p>
        <button type="submit" th:text="${usuarioId != null ? 'Salvar alterações' : 'Cadastrar'}">
            Cadastrar
        </button>
    </form>

    <p><a th:href="@{/usuarios}">Ver usuários cadastrados</a></p>
</body>
</html>
